
name: Train, evaluate, and deploy Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "data/**"
      - "src/**"
      - "docs/**"
      - "requirements.txt"
      - ".github/workflows/train-evaluate-deploy.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  train-evaluate-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Check dataset folders
        run: |
          python - <<'PY'
          from pathlib import Path

          extensions = {".jpg", ".jpeg", ".png", ".bmp"}
          classes = ["peacock", "sparrow"]

          for split in ["train", "test"]:
              for bird in classes:
                  folder = Path("data") / split / bird
                  if not folder.is_dir():
                      raise SystemExit(f"Missing folder: {folder}")

                  images = [
                      p for p in folder.rglob("*")
                      if p.is_file() and p.suffix.lower() in extensions
                  ]
                  print(f"{split}/{bird}: {len(images)} images")

                  if split == "train" and len(images) < 2:
                      raise SystemExit(
                          f"Need at least 2 training images in {folder}"
                      )
                  if split == "test" and len(images) < 1:
                      raise SystemExit(
                          f"Need at least 1 test image in {folder}"
                      )
          PY

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Train and evaluate model
        run: python -u src/train.py

      - name: Verify generated website model and reports
        run: |
          test -f docs/model/model.json
          test -f docs/evaluation/summary.json
          test -f docs/evaluation/metrics.json
          test -f docs/evaluation/classification_report.csv
          test -f docs/evaluation/confusion-matrix.png

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
